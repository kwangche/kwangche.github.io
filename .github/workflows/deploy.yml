name: Deploy Next.js (Static Export) to GitHub Pages

on:
	push:
		branches:
			- main
			- master
	workflow_dispatch:

permissions:
	contents: read
	pages: write
	id-token: write

concurrency:
	group: pages
	cancel-in-progress: true

jobs:
	build:
		runs-on: ubuntu-latest
		steps:
			- name: Checkout
				uses: actions/checkout@v4

			- name: Setup Node
				uses: actions/setup-node@v4
				with:
					node-version: 22
					cache: npm

			- name: Install
				run: npm ci

			- name: Build (static export)
				env:
					# User/Org Pages(<user>.github.io)면 basePath 없이 배포, Project Pages면 /<repo> 사용
					NEXT_PUBLIC_BASE_PATH: ${{ endsWith(github.event.repository.name, '.github.io') && '' || format('/{0}', github.event.repository.name) }}
				run: npm run build

			- name: Upload artifact
				uses: actions/upload-pages-artifact@v3
				with:
					path: out

	deploy:
		needs: build
		runs-on: ubuntu-latest
		environment:
			name: github-pages
			url: ${{ steps.deployment.outputs.page_url }}
		steps:
			- name: Deploy to GitHub Pages
				id: deployment
				uses: actions/deploy-pages@v4
